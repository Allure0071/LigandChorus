[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ligandchorus"
version = "0.1.0"
description = "E18 structure-aware parallel decoding for fixed-backbone enzyme sequence design"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "torch>=2.5"]

[tool.setuptools.packages.find]
include = ["ligandchorus*"]

[tool.setuptools.package-data]
"ligandchorus._vendor" = ["LIGANDMPNN_LICENSE"]
